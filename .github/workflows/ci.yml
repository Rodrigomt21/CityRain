# CI do CityRain: testes de ML e backend e build do dashboard a cada push/PR.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ml:
    name: ML (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml/requirements-ci.txt
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r ml/requirements-ci.txt
      - run: python -m pytest -q ml/tests

  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cityrain
          POSTGRES_PASSWORD: cityrain
          POSTGRES_DB: cityrain_teste
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cityrain" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://cityrain:cityrain@localhost:5432/cityrain_teste
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - run: cd backend && python -m pytest -q tests

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

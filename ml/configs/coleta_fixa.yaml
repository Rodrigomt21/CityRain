# Envio ao vivo (coletor.py --enviar): um dispositivo por câmera, nome fixa-<id>,
# token em CITYRAIN_TOKEN_<ID> ou em ml/configs/coleta_fixa_tokens.json (gitignored).
backend_url: https://api-production-046f.up.railway.app/api/v1/ingest
# Fontes do coletor de câmeras fixas (ml/scripts/coleta_fixa/coletor.py).
# Lives verificadas no ar em 04/10/2026 via yt-dlp. Lat/lon são APROXIMADOS pelo
# local declarado no título (marco/bairro) — conferir na própria imagem antes de
# usar o rótulo: a rotulagem só aceita estação a poucos km.
#
# Para pluviômetro fora da capital é preciso acrescentar as estações CEMADEN da
# cidade em ml/scripts/estacoes/baixar_cemaden_ped.py (hoje só tem SP capital).
destino: ml/data/raw/coleta_fixa
# 1 frame a cada 10 min: só exemplos secos e variedade dia/noite. A CHUVA vem do
# recuperar_dvr.py --onde-choveu (DVR de 120 h, baixa só os minutos em que choveu);
# rodar a cada 1-2 dias, depois de baixar_cemaden_ped.py --dias <últimos dias>.
intervalo_s: 600

fontes:
  # posicao_verificada (08/10/2026): endereço da descrição da live / site do local, geocodificado no
  # OpenStreetMap (Nominatim). Santos e Praia Grande: links trocados em 08/10 (lives antigas saíram do ar); posição ainda aproximada.
  # --- capital (estações já cadastradas) ---
  - {id: sp_centro_geolan, tipo: youtube, url: "https://www.youtube.com/watch?v=dJN7snkYg-I", lat: -23.5393, lon: -46.6408, descricao: "Geolan — Rua Vitória (Vitória Hostel), República, SP", posicao_verificada: true, fonte_publica: "https://www.youtube.com/watch?v=dJN7snkYg-I"}
  # --- Baixada Santista / litoral SP (CEMADEN tem rede densa lá) ---
  - {id: santos_gonzaga, tipo: youtube, url: "https://www.youtube.com/watch?v=1I0G3d-obsc", lat: -23.9680, lon: -46.3340, descricao: "Olhar 013 — Gonzaga/Canal 2, Santos", posicao_verificada: false, fonte_publica: ""}
  - {id: praiagrande_boqueirao, tipo: youtube, url: "https://www.youtube.com/watch?v=wNXOI0pmz7I", lat: -24.0102, lon: -46.4027, descricao: "Praia Grande — Boqueirão, Canto do Forte (aprox.)", posicao_verificada: false, fonte_publica: ""}
  # sem pluviômetro CEMADEN a <= 5 km (o mais perto está a 7 km): desligada
  - {id: praiagrande_tupi, ativa: false, tipo: youtube, url: "https://www.youtube.com/watch?v=J_ne7psSqBk", lat: -24.0340, lon: -46.5050, descricao: "Praia Grande — Tupi"}
  - {id: guaruja_enseada, tipo: youtube, url: "https://www.youtube.com/watch?v=v5Y6WsD577M", lat: -23.9852, lon: -46.2107, descricao: "Guarujá — Hotel Palmar, Av. Miguel Estefno 4507, Enseada (Tortuga)", posicao_verificada: true, fonte_publica: "https://www.youtube.com/watch?v=v5Y6WsD577M"}
  - {id: ubatuba_tenorio, tipo: youtube, url: "https://www.youtube.com/watch?v=CJGzm3qjFUk", lat: -23.4653, lon: -45.0580, descricao: "UBACAM — Praia do Tenório (canto direito), Ubatuba", posicao_verificada: true, fonte_publica: "https://ubacam.com.br"}
  # --- outros estados (chuva forte de verão frequente) ---
  - {id: bc_atlantica, tipo: youtube, url: "https://www.youtube.com/watch?v=5Xl6pSgiy3A", lat: -26.9930, lon: -48.6330, descricao: "CLIMA BC — Av. Atlântica, Centro, Balneário Camboriú", posicao_verificada: true, fonte_publica: "https://www.youtube.com/watch?v=5Xl6pSgiy3A"}
  # --- 09/10/2026: lives novas para ter mais eventos de chuva em câmeras diferentes antes do

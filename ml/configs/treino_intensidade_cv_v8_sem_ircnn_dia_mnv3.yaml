# CV v8 SEM irCNN no treino (pergunta: o modelo do carro precisa da câmera de vigilância?). Igual à v8,
# mas max_por_evento: 0 tira o irCNN do treino e do val; os eventos irCNN seguem só como teste (fora do domínio).
# CV v3: sintético v1 (venceu o v2 na CV de 04/10) + irCNN amostrado por (evento, classe), que
# corrige o atalho 'cara de irCNN => não é garoa' (CV v1: F1 garoa irCNN 0,02).
# mais eventos do irCNN no treino. Dataset: ml/data/splits/intensidade_v1.csv (spec D3).
# Rodar: ml/.venv/bin/python ml/scripts/treino/treinar_intensidade.py ml/configs/treino_intensidade_cv_mnv3.yaml --cv
nome: intensidade_cv_v8_sem_ircnn_dia_mnv3
seed: 42

dados:
  splits_csv: ml/data/splits/intensidade_v8_dashcam.csv
  origens_treino: [real, bdd, dashcam]   # v8: + câmeras veiculares (forte)
  # (versão só-dia) Folds declarados, nunca sorteados: 3 eventos por fold, misturando dia/noite e com
  # garoa (eventos 3, 8, 9, 10, 12) espalhada. No fold k: folds[k] = teste,
  # folds[k+1][0] = val, o resto = treino. Ver eventos_ircnn() em training/intensidade.py.
  ircnn_cv:
    fold: 0
    max_por_evento: 0          # SEM irCNN no treino e no val
    amostrar_por_classe: true
    folds:   # SÓ DIA (15/10: noite fora do escopo do modelo do carro): eventos noturnos 7-12 fora
      - [ircnn__event_2, ircnn__event_4]    # dia, dia
      - [ircnn__event_3, ircnn__event_1]    # dia (única garoa diurna), dia
      - [ircnn__event_5, ircnn__event_6]    # dia, dia

entrada:            # 4:3, igual ao frame da câmera (640x480)
  altura: 288
  largura: 384

modelo:
  arquitetura: mobilenet_v3_large
  pretreinado: true

aumentacao:
  flip_horizontal: true
  recorte_escala_min: 0.85
  brilho_contraste: 0.2
  jpeg_qualidade_min: 60   # recomprime tudo: tira o atalho da dupla compressão do sintético

treino:
  dispositivo: auto
  epocas: 12
  batch: 32
  lr: 0.0005
  weight_decay: 0.0001
  label_smoothing: 0.1
  paciencia: 5
  workers: 4

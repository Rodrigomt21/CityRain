# Candidato a PRODUÇÃO v11 (carro, SÓ DIA, sem sintético): desenho exato da CV v11 (6 épocas fixas, fica a
# última) com --fold final: todos os eventos irCNN de dia e TODO o para-brisa no treino.
# CV v10: v7 + dashcam do YouTube (com LA) + BlackVue de para-brisa do usuário allen no Mapillary (626 forte, 671
# moderada, 232 garoa em 7 dias). Mesmo desenho da v9; só muda splits_csv.
# CV v3: sintético v1 (venceu o v2 na CV de 04/10) + irCNN amostrado por (evento, classe), que
# corrige o atalho 'cara de irCNN => não é garoa' (CV v1: F1 garoa irCNN 0,02).
# mais eventos do irCNN no treino. Dataset: ml/data/splits/intensidade_v1.csv (spec D3).
# Rodar: ml/.venv/bin/python ml/scripts/treino/treinar_intensidade.py ml/configs/treino_intensidade_cv_mnv3.yaml --cv
nome: intensidade_final_v11_pb6_dia_mnv3
seed: 42

dados:
  splits_csv: ml/data/splits/intensidade_v10_allen.csv
  origens_treino: [real, bdd, dashcam, mapillary]   # v10: mapillary = BlackVue do allen (7 dias, 3 classes)
  # (versão só-dia) Folds declarados, nunca sorteados: 3 eventos por fold, misturando dia/noite e com
  # garoa (eventos 3, 8, 9, 10, 12) espalhada. No fold k: folds[k] = teste,
  # folds[k+1][0] = val, o resto = treino. Ver eventos_ircnn() em training/intensidade.py.
  ircnn_cv:
    fold: 0
    max_por_evento: 150        # por (evento, classe)
    amostrar_por_classe: true
    folds:   # SÓ DIA (15/10: noite fora do escopo do modelo do carro): eventos noturnos 7-12 fora
      - [ircnn__event_2, ircnn__event_4]    # dia, dia
      - [ircnn__event_3, ircnn__event_1]    # dia (única garoa diurna), dia
      - [ircnn__event_5, ircnn__event_6]    # dia, dia
  parabrisa_cv:   # 1 grupo por fold do irCNN; cada evento fora do treino em exatamente 1 fold
    folds:
      - [mapillary__allen_2024-07-27, mapillary__allen_2024-09-09, mapillary__allen_2025-08-23]
      - [dashcam__lib41z-4zVk, mapillary__allen_2025-07-09, mapillary__allen_2026-05-29, dashcam__cG3oG9QxjVg]
      - [dashcam__BEl8JZr-NHY, dashcam__HRL2l7OVQJs, mapillary__allen_2025-08-24, mapillary__allen_2026-04-05, dashcam__kUhyK5VuwPM]

entrada:            # 4:3, igual ao frame da câmera (640x480)
  altura: 288
  largura: 384

modelo:
  arquitetura: mobilenet_v3_large
  pretreinado: true

aumentacao:
  flip_horizontal: true
  recorte_escala_min: 0.85
  brilho_contraste: 0.2
  jpeg_qualidade_min: 60   # recomprime tudo: tira o atalho da dupla compressão do sintético

treino:
  dispositivo: auto
  epocas: 6
  sem_selecao_por_val: true
  batch: 32
  lr: 0.0005
  weight_decay: 0.0001
  label_smoothing: 0.1
  paciencia: 5
  workers: 4

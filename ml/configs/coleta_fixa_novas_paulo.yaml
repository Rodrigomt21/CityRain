    tipo: youtube
    url: "https://www.youtube.com/watch?v=mNtZ7IFlxZU"
    lat: -23.56544
    lon: -46.65120
    descricao: "Rádio TV CDL SP, Av. Paulista altura do nº 900 (Gazeta/Cásper Líbero), Bela Vista, São Paulo"
    posicao_verificada: true
    fonte_publica: "https://www.youtube.com/watch?v=mNtZ7IFlxZU"


  # (nó comum das duas vias): -23.65107, -46.70911. Estações reportando: Santo Amaro Paulista 0,12 km e
  # Jardim São Luís 1,57 km (rótulo por 1 estação, regra CF3.1). A live cai e volta com link novo (o vigia troca).
  - id: sp_santoamaro_largo13

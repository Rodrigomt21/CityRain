# Câmeras novas do Paulo (kit ml/scripts/coleta_fixa/novas_cameras, GUIA.md). Sem segredo: pode ir para o Git.
destino: ml/data/raw/novas_paulo/frames
intervalo_s: 600

fontes:
  # Live reinicia todo dia: link do canal /live (sem DVR, só ao vivo).
  # Posição: só "Rua do Imperador". O trecho sul/oeste da rua (lon < -43,175) tem 3 estações CEMADEN
  # reportando a <= 5 km (Alto da Serra 2,2 km, Morin 2,4 km, Quitandinha 4,7 km); o trecho nordeste tem 2.
  # Falta achar o prédio pela imagem (canal do rio no meio da rua, faixa de pedestre, prédio neoclássico
  # de esquina) para marcar posicao_verificada: true.
  - id: petropolis_imperador
    ativa: false   # desativada em 14/10: estratégia nova só SP/ABC perto de pluviômetro
    tipo: youtube
    url: "https://www.youtube.com/channel/UCEugTiIjeITHGvdU-C7D2Jg/live"
    lat: -22.51037
    lon: -43.17594
    descricao: "Petrópolis 24h, Rua do Imperador, Centro, Petrópolis/RJ (aprox.: rua)"
    posicao_verificada: false
    fonte_publica: "https://www.youtube.com/watch?v=f93TPY4U-xM"

  # Canal "Tá ao vivo" (Olinda): as lives recomeçam a cada 8 a 12 h com link novo. Trocar o url quando cair
  # (listar: yt-dlp --flat-playlist https://www.youtube.com/channel/UCAjAwOKrfmZX1552JnE_i5g/streams).
  # Posição: a câmera mostra a fachada da Sociedade Beneficente de Artistas e Operários de Olinda (placa
  # legível na imagem), Rua Bernardo Vieira de Melo, 127 (CNPJ 35.617.315/0001-67). A rua tem ~170 m saindo
  # dos Quatro Cantos; ponto usado = ~127 m do início (numeração métrica), incerteza ~50 m.
  # Pluviômetro: em qualquer ponto da rua há 3 estações reportando a <= 5 km (Fragoso, Torreão 4,2, Porto 4,8);
  # Jardim Fragoso fica a 1,90-2,06 km, na fronteira dos 2 km (decide se o rótulo vem de 1 estação ou do consenso).
  - id: olinda_quatrocantos
    ativa: false   # desativada em 14/10: estratégia nova só SP/ABC perto de pluviômetro
    tipo: youtube
    url: "https://www.youtube.com/watch?v=zhOBRQVm950"
    lat: -8.01575
    lon: -34.85277
    descricao: "Tá ao vivo, Rua Bernardo Vieira de Melo em frente ao nº 127 (Sociedade Beneficente de Artistas e Operários), Quatro Cantos, Olinda/PE"
    posicao_verificada: true
    fonte_publica: "https://www.infoinvest.com.br/consulta-empresa/35617315000167-sociedade-beneficente-de-artistas-e-operarios-de-olinda"
  # Posição aproximada: só o bairro (título "Olinda Varadouro"; casa laranja nº 68 ao lado da câmera, rua não
  # identificada). Aceita pelo critério do GUIA ("qualquer ponto da área passa"): 119 de 121 pontos do bairro
  # (OSM) têm 1 estação reportando a <= 2 km ou 3 a <= 5 km. Decidido pelo Paulo em 14/10.
  - id: olinda_varadouro
    ativa: false   # desativada em 14/10: estratégia nova só SP/ABC perto de pluviômetro
    tipo: youtube
    url: "https://www.youtube.com/watch?v=KvdrS1IohWc"
    lat: -8.01914
    lon: -34.85417
    descricao: "Tá ao vivo, Varadouro, Olinda/PE (aprox.: bairro, quase todo ponto passa no pluviômetro; casa nº 68 ao lado da câmera)"
    posicao_verificada: true
    fonte_publica: "https://www.youtube.com/watch?v=x8l-Zg2WwSI"

  # SP capital: câmera boa (fixa, alta, muito céu), mas SEM estação CEMADEN reportando a <= 5 km.
  # Coletando só ao vivo enquanto o Rodrigo decide se o teste prospectivo aceita pluviômetro do CGE-SP.
  # Posição aproximada (estação Tatuapé); a câmera olha o viaduto da Radial Leste com a Salim Farah Maluf.
  - id: sp_tatuape_radial
    ativa: false   # desativada em 14/10: estratégia nova só SP/ABC perto de pluviômetro
    tipo: youtube
    url: "https://www.youtube.com/watch?v=iv_pnlX_td4"
    lat: -23.5403
    lon: -46.5765
    descricao: "TRAINS LIVE BRASIL, Tatuapé SP: Radial Leste, Salim Farah Maluf, Linha 3 e CPTM (aprox.: estação Tatuapé)"
    posicao_verificada: false
    fonte_publica: "https://www.youtube.com/watch?v=iv_pnlX_td4"
  # ===== Estratégia de 14/10: só SP e ABC, perto de pluviômetro CEMADEN, de olho em chuva forte =====

  # Rádio TV CDL SP: "Avenida Paulista, na altura do número 900" (descrição e tarja da live), em frente à
